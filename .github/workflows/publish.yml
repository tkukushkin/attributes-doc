name: Publish to PyPI.org
on:
  release:
    types: [ published ]
jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup uv
      uses: astral-sh/setup-uv@v7

    - name: Build
      run: uv build

    - name: Publish package
      run: uv publish
