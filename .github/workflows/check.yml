name: Check

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        include:
        - python-version: '3.10'
          tox-env: test-py310
        - python-version: '3.11'
          tox-env: test-py311
        - python-version: '3.12'
          tox-env: test-py312
        - python-version: '3.13'
          tox-env: test-py313
        - python-version: '3.14'
          tox-env: test-py314
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run tests
      run: uvx --with tox-uv tox run -e ${{ matrix.tox-env }},coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: .tox/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.10'

    - name: Run linters
      run: uvx --with tox-uv tox run -e lint
